<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Quote Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #383a3cf7, #7d7d79cd,#383a3cf7);
        }

        .quote-box {
            width: 550px;
            max-width: 90%;
            padding: 40px;
            background: white;
            border-radius: 20px;
            text-align: center;
         box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-decoration: underline;
            font-size: 32px;
            color: #243b55;
            margin-bottom: 30px;
        }

        #quote {
            font-size: 24px;
            line-height: 1.5;
            color: #020202;
            margin-bottom: 20px;
        }

        #author {
            font-size: 18px;
            color: #151d35;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #000000cd;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease forwards;
        }

        button:hover {
            background: #717477;
            transform: scale(1.10);
        }
    </style>
</head>

<body>

    <div class="quote-box">

        <h1>Random Quote Generator</h1>

        <p id="quote">Loading quote...</p>

        <h3 id="author"></h3>

        <button onclick="newQuote()">
            New Quote
        </button>

    </div>


    <script>

        let quotes = [];

        // Fetch quotes only once
        async function loadQuotes() {

            try {

                const response = await fetch(
                    "https://dummyjson.com/quotes"
                );

                const data = await response.json();
                quotes = data.quotes;
                newQuote();

            } catch (error) {

                document.getElementById("quote").textContent =
                    "Unable to load quotes.";

                console.log(error);
            }
        }


       
        function newQuote() {

            if (quotes.length === 0) {
                return;
            }

            const randomIndex =
                Math.floor(Math.random() * quotes.length);

            const randomQuote = quotes[randomIndex];

            document.getElementById("quote").textContent =
                `"${randomQuote.quote}"`;

            document.getElementById("author").textContent =
                `— ${randomQuote.author}`;
        }


        
        loadQuotes();

    </script>

</body>

</html>
